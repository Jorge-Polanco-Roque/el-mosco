<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>un mosco · y una camioneta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#272727; --accent:#007aff; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#e9edf8;
            font-family:"Londrina Solid",system-ui,sans-serif;color:var(--ink)}
  body.ready{cursor:none}              /* cursor nativo oculto solo si el JS arrancó bien */
  #cursor{display:none}
  body.ready #cursor{display:block}
  #err{position:fixed;inset:auto 0 0 0;background:#df48ef;color:#fff;font:14px/1.4 system-ui;
       padding:12px 16px;z-index:999;display:none}
  #app{position:fixed;inset:0}
  canvas{display:block}

  .ui{position:fixed;inset:0;pointer-events:none;z-index:20}
  /* acto / progreso arriba izq */
  .act{position:absolute;top:24px;left:30px;font-weight:300;font-size:13px;letter-spacing:4px;opacity:.5;text-transform:uppercase}
  /* banner de reto arriba centro */
  .reto{position:absolute;top:22px;left:50%;transform:translateX(-50%);
        font-weight:900;font-size:22px;letter-spacing:2px;opacity:0;transition:opacity .5s;
        text-align:center;text-transform:uppercase}
  .reto small{display:block;font-weight:300;font-size:12px;letter-spacing:3px;opacity:.6;text-transform:none;margin-top:2px}
  /* narración abajo centro */
  .cap{position:absolute;left:50%;bottom:11%;transform:translate(-50%,0);width:min(760px,86vw);
       text-align:center;font-weight:300;font-size:clamp(18px,3vw,30px);line-height:1.35;
       opacity:0;transition:opacity .8s;letter-spacing:.3px}
  .cap b{font-weight:900}
  .snd{position:absolute;bottom:22px;right:26px;font-weight:300;font-size:12px;letter-spacing:2px;opacity:.4;text-transform:uppercase}
  .snd.off{text-decoration:line-through;opacity:.25}
  .cap .accent{color:var(--accent)}
  /* título grande (intro / final) */
  .big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;opacity:0;transition:opacity 1.1s;padding:20px}
  .big h1{font-weight:900;font-size:clamp(44px,10vw,120px);line-height:.9;letter-spacing:1px}
  .big h1 .y{color:#f2d21a;-webkit-text-stroke:2px var(--ink)}
  .big p{font-weight:300;font-size:clamp(14px,2.4vw,22px);letter-spacing:2px;margin-top:18px;opacity:.7}
  .big .go{margin-top:34px;font-weight:400;font-size:16px;letter-spacing:3px;opacity:.55;text-transform:uppercase}
  .pulse{animation:pl 1.8s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:.35}50%{opacity:.8}}

  /* fundido de transición */
  #fade{position:fixed;inset:0;background:#e9edf8;z-index:30;pointer-events:none;opacity:0;transition:opacity .6s}

  /* cursor manita */
  #cursor{position:fixed;top:0;left:0;width:44px;height:44px;pointer-events:none;z-index:60;
          transform:translate(-8px,-4px) rotate(-12deg);transition:transform .12s ease-out;will-change:transform}
  #cursor svg{width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(40,40,60,.18))}
  body.grab #cursor{transform:translate(-8px,-4px) rotate(-12deg) scale(.82)}
</style>
</head>
<body>
<div id="app"></div>
<div id="fade"></div>
<div id="err"></div>

<div class="ui">
  <div class="act" id="act"></div>
  <div class="reto" id="reto"></div>
  <div class="cap" id="cap"></div>
  <div class="snd" id="snd">♪ música · M</div>

  <div class="big" id="intro" style="opacity:1">
    <h1>un <span class="accent" style="color:var(--accent)">mosco</span><br>y una camioneta</h1>
    <p>una crisis existencial en 6 actos</p>
    <div class="go pulse">respira · toca para empezar</div>
  </div>

  <div class="big" id="outro">
    <h1>hay que imaginar<br>al <span class="y">mosco</span> feliz</h1>
    <p>— y a ti también.</p>
    <div class="go">fin. (o principio.) &nbsp; · &nbsp; R para revivir</div>
  </div>
</div>

<div id="cursor">
  <svg viewBox="0 0 64 64" fill="#fff" stroke="#272727" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M26 8c0-3 5-3 5 0v20l3-9c1-3 6-2 5 1l-1 7 4-4c2-2 6 1 4 4l-3 5 4-1c3-1 5 3 2 5l-9 6c-3 2-4 6-9 6h-6c-4 0-7-2-9-6l-7-13c-2-3 3-6 5-3l4 5V16c0-3 5-3 5 0v8h5V8z"/>
  </svg>
</div>

<script>
  // Muestra cualquier fallo (p.ej. CDN bloqueado) en vez de dejar la pantalla muerta.
  addEventListener('error', e=>{
    const el=document.getElementById('err');
    el.style.display='block';
    el.textContent='⚠ '+(e.message||e.type)+(e.filename?(' · '+e.filename):'');
  });
  addEventListener('unhandledrejection', e=>{
    const el=document.getElementById('err'); el.style.display='block';
    el.textContent='⚠ '+(e.reason&&e.reason.message||e.reason||'promesa rechazada');
  });
</script>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ---------- setup ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9edf8');
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,0,16);

scene.add(new THREE.HemisphereLight('#ffffff','#c9d4ea',1.05));
const key = new THREE.DirectionalLight('#ffffff',1.1); key.position.set(4,8,6); scene.add(key);

const grad = new Uint8Array([90,160,220,255]);
const gradMap = new THREE.DataTexture(grad, grad.length,1, THREE.RedFormat); gradMap.needsUpdate=true;

const COLORS = ['#faf56c','#9984e8','#df48ef','#b3d4fc','#007aff','#96aee6'];
const OUTLINE = new THREE.MeshBasicMaterial({ color:'#272727', side:THREE.BackSide });

function makeBlob(color, size=1, gi=0){
  let g;
  switch(gi%5){
    case 0: g=new THREE.IcosahedronGeometry(1,1); break;
    case 1: g=new THREE.TorusGeometry(0.8,0.36,16,28); break;
    case 2: g=new THREE.CapsuleGeometry(0.55,0.9,8,16); break;
    case 3: g=new THREE.SphereGeometry(1,24,24); break;
    default:g=new THREE.ConeGeometry(0.9,1.5,24); break;
  }
  const mat=new THREE.MeshToonMaterial({ color, gradientMap:gradMap, transparent:true, opacity:1 });
  const m=new THREE.Mesh(g,mat);
  const o=new THREE.Mesh(g,OUTLINE); o.scale.setScalar(1.08); m.add(o);
  m.scale.setScalar(size);
  m.userData={ base:size };
  return m;
}

// pointer helpers
const ray=new THREE.Raycaster();
const ptr=new THREE.Vector2();
const ptrPx={x:innerWidth/2,y:innerHeight/2};
const planeZ0=new THREE.Plane(new THREE.Vector3(0,0,1),0);
const world=new THREE.Vector3();
function screenToWorld(){ ray.setFromCamera(ptr,camera); ray.ray.intersectPlane(planeZ0,world); return world; }
addEventListener('pointermove',e=>{
  ptrPx.x=e.clientX; ptrPx.y=e.clientY;
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
});

// ---------- UI narration ----------
const $act=document.getElementById('act'), $reto=document.getElementById('reto'),
      $cap=document.getElementById('cap'), $fade=document.getElementById('fade'),
      $intro=document.getElementById('intro'), $outro=document.getElementById('outro');
let capTimer=null;
function say(html, hold=0){
  $cap.style.opacity=0;
  clearTimeout(capTimer);
  capTimer=setTimeout(()=>{ $cap.innerHTML=html; $cap.style.opacity=1;
    if(hold){ capTimer=setTimeout(()=>$cap.style.opacity=0, hold); } }, 380);
}
function reto(title, sub=''){ $reto.innerHTML = title ? `${title}${sub?`<small>${sub}</small>`:''}` : ''; $reto.style.opacity = title?1:0; }
function setAct(n,name){ $act.textContent = n!=null? `acto ${n} — ${name}` : ''; }
async function fade(fn){
  $fade.style.opacity=1;
  await wait(620); fn(); await wait(220);
  $fade.style.opacity=0;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// bg tint per mood
function bg(hex, ms=1600){
  const from=scene.background.clone(), to=new THREE.Color(hex), t0=performance.now();
  (function step(){ const k=Math.min(1,(performance.now()-t0)/ms);
    scene.background.copy(from).lerp(to,k); if(k<1) requestAnimationFrame(step); })();
}

// ---------- state machine ----------
let ACT=-1;                 // -1 intro, 0..5 acts, 6 outro
let group=new THREE.Group(); scene.add(group);
let A={};                   // per-act scratch
function clearGroup(){ group.clear(); A={}; }

// ===== ACT 0 — el detonante =====
function enter0(){
  clearGroup(); setAct(0,'el detonante'); bg('#e9edf8');
  say('Era martes. O jueves. Da igual.', 2600);
  A.mosco = makeBlob('#272727',0.28,3); A.mosco.position.set(-3,-1,0); group.add(A.mosco);
  A.mvel = new THREE.Vector2((Math.random()-.5),(Math.random()-.5));
  // camioneta = luz cálida enorme, entra desde la derecha
  A.truck = makeBlob('#faf56c',2.6,0); A.truck.visible=false; A.truck.position.set(14,-1,-1); group.add(A.truck);
  // línea carretera
  const road=new THREE.Mesh(new THREE.PlaneGeometry(40,0.06), new THREE.MeshBasicMaterial({color:'#c9d4ea'}));
  road.position.set(0,-3.4,-2); group.add(road);
  A.tries=0; A.phase='tell'; A.tt=0;
  setTimeout(()=>{ say('Un mosco cruzaba la carretera. Sin razón. Como todo.',3000);
    setTimeout(()=>startRun0(),3200); }, 2800);
}
function startRun0(){
  A.phase='run'; A.tt=0; A.truck.visible=true; A.truck.position.x=14;
  A.mosco.position.set(-3,-1+Math.random()*2,0); A.mosco.material.opacity=1; A.mosco.visible=true;
  reto('sálvalo', `toca al mosco · intento ${A.tries+1}/3`);
  say('Entonces — una camioneta.', 1600);
}
function update0(dt){
  if(A.phase!=='run') return;
  A.tt+=dt;
  // mosco erratico
  A.mvel.x+=(Math.random()-.5)*0.6*dt*8; A.mvel.y+=(Math.random()-.5)*0.6*dt*8;
  A.mvel.multiplyScalar(0.96);
  A.mosco.position.x+=A.mvel.x*dt*2.2; A.mosco.position.y+=A.mvel.y*dt*2.2;
  A.mosco.position.x=THREE.MathUtils.clamp(A.mosco.position.x,-6,5);
  A.mosco.position.y=THREE.MathUtils.clamp(A.mosco.position.y,-3,3);
  A.mosco.rotation.z+=dt*10;
  // camioneta avanza
  A.truck.position.x -= dt*7.5;
  A.truck.rotation.z -= dt*2;
  if(A.truck.position.x < A.mosco.position.x-0.2){ fail0(); }
}
function fail0(){
  A.phase='dead'; A.mosco.visible=false; reto(''); Audio.zap();
  A.tries++;
  if(A.tries<3){
    say('No llegaste. Nadie llega.', 1900);
    setTimeout(()=>startRun0(), 2100);
  }else{
    say('Un instante antes zumbaba.<br>Un instante después: <b>nada</b>.<br>El universo no parpadeó.');
    setTimeout(()=> say('¿y si <b class="accent">tú</b> fueras el mosco?'), 4200);
    setTimeout(()=> next(), 7200);
  }
}
function click0(){
  if(A.phase!=='run') return;
  const d = screenToWorld().distanceTo(A.mosco.position);
  if(d<0.9){ // "lo tocaste" — pero da igual, igual muere
    A.phase='dead'; A.mosco.visible=false; reto('');
    A.tries++;
    say('Lo tocaste. Por un segundo lo salvaste.<br>Solo que el segundo también pasa.',2400);
    if(A.tries<3) setTimeout(()=>startRun0(),2600);
    else { setTimeout(()=>say('¿y si <b class="accent">tú</b> fueras el mosco?'),2600); setTimeout(()=>next(),6000); }
  }
}

// ===== ACT 1 — la insignificancia =====
let dots, dotColorAccent=new THREE.Color('#007aff');
function enter1(){
  clearGroup(); setAct(1,'la insignificancia'); bg('#e6eaf6');
  say('Ocho mil millones de zumbidos.<br>Cada uno seguro de ser el centro.',3400);
  const N=260, g=new THREE.SphereGeometry(0.13,10,10);
  const mat=new THREE.MeshToonMaterial({gradientMap:gradMap});
  dots=new THREE.InstancedMesh(g,mat,N); dots.instanceColor=null;
  const dummy=new THREE.Object3D(), base=new THREE.Color('#8f9bbf');
  for(let i=0;i<N;i++){
    const r=Math.sqrt(Math.random())*7, a=Math.random()*Math.PI*2;
    dummy.position.set(Math.cos(a)*r, Math.sin(a)*r*0.62, (Math.random()-.5)*1.5);
    dummy.updateMatrix(); dots.setMatrixAt(i,dummy.matrix); dots.setColorAt(i,base);
  }
  group.add(dots); A.tries=0;
  setTimeout(()=>reto('encuéntrate','toca el punto que eres tú'),3600);
}
function click1(){
  if(!dots) return;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObject(dots)[0];
  if(!hit) return;
  dots.setColorAt(hit.instanceId, dotColorAccent); dots.instanceColor.needsUpdate=true;
  A.tries++;
  if(A.tries<3){ Audio.deny(); say('Ese no eras tú.',1500); }
  else{
    Audio.pick();
    reto('');
    say('Ninguno era especial.<br>Tampoco tú.<br>Y sin embargo, <b>aquí sigues mirando</b>.');
    setTimeout(()=>next(),5200);
  }
}

// ===== ACT 2 — el absurdo (Sísifo) =====
function enter2(){
  clearGroup(); setAct(2,'el absurdo'); bg('#dfe3f2');
  say('Despiertas. Trabajas. Duermes. Repites.',3000);
  A.rock=makeBlob('#9984e8',1.1,0); A.rock.position.set(0,-3,0); group.add(A.rock);
  A.effort=0; A.grab=false; A.vy=0;
  setTimeout(()=>{ say('Empujas la piedra. La piedra cae. Empujas otra vez.',3000);
    reto('llévalo a la cima','arrástralo hacia arriba · sostén el esfuerzo'); },3200);
}
function update2(dt){
  if(!A.rock) return;
  const r=A.rock;
  if(A.grab){
    const w=screenToWorld();
    r.position.x += (w.x-r.position.x)*0.25;
    r.position.y += (w.y-r.position.y)*0.25;
    A.vy=0;
  }else{
    A.vy -= 9.8*dt*0.35;                 // gravedad
    r.position.y += A.vy*dt;
    r.position.x += ( (Math.random()-.5)*0.3 - r.position.x*0.02); // deriva
    if(r.position.y<-3){ r.position.y=-3; A.vy=0; }
  }
  r.rotation.z -= (r.position.y>-2.9? dt*2:0);
  // esfuerzo: acumula mientras esté arriba
  if(r.position.y>2.2) A.effort += dt; else A.effort -= dt*0.4;
  A.effort=THREE.MathUtils.clamp(A.effort,0,2.2);
  r.scale.setScalar(r.userData.base*(1+A.effort*0.05));
  if(A.effort>=2.0){
    A.rock=null; reto('');
    say('Lo lograste. Y mañana la piedra estará abajo otra vez.',3200);
    setTimeout(()=>say('Nunca se queda arriba. <b>Ese es el punto.</b>'),3400);
    setTimeout(()=>say('Camus sonríe:<br><i>«La lucha hacia las cumbres basta para llenar un corazón.»</i>'),6800);
    setTimeout(()=>next(),11200);
  }
}

// ===== ACT 3 — el vértigo de la libertad =====
function enter3(){
  clearGroup(); setAct(3,'el vértigo de la libertad'); bg('#d8dcee');
  say('Nadie escribió el guion.<br>Estás condenado a ser <b>libre</b>.',3600);
  A.doors=[]; const n=5;
  for(let i=0;i<n;i++){
    const d=makeBlob(COLORS[i%COLORS.length],1.05,i);
    d.position.set((i-(n-1)/2)*3.0, 0.2, 0);
    group.add(d); A.doors.push(d);
  }
  A.chosen=false;
  setTimeout(()=>{ say('Cada sí es mil noes.<br>Cada puerta, un cementerio de puertas.',3600);
    reto('elige','solo una · las demás no vuelven'); },3800);
}
function update3(dt){
  if(!A.doors) return;
  const t=performance.now()/1000;
  A.doors.forEach((d,i)=>{ if(d.userData.dead){ d.scale.multiplyScalar(0.9); d.material.opacity*=0.9; }
    else { d.position.y=0.2+Math.sin(t*1.3+i)*0.18; d.rotation.y+=dt; } });
}
function click3(){
  if(A.chosen||!A.doors) return;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(A.doors,true)[0];
  if(!hit) return;
  let picked=hit.object; while(picked.parent&&!A.doors.includes(picked)) picked=picked.parent;
  A.chosen=true; reto(''); Audio.choose();
  A.doors.forEach(d=>{ if(d!==picked) d.userData.dead=true; });
  say('Elegiste. Nunca sabrás qué había detrás de las otras.<br>Nadie lo sabe. <b>Eso es vivir.</b>');
  setTimeout(()=>next(),5400);
}

// ===== ACT 4 — ser-para-la-muerte =====
function enter4(){
  clearGroup(); setAct(4,'ser-para-la-muerte'); bg('#cdd2e6');
  say('Desde que naciste, algo se agota.<br>Puedes fingir que no. La mayoría lo hace.',3800);
  A.me=makeBlob('#df48ef',1.4,3); group.add(A.me);
  A.life=1; A.age=0; A.done=false;
  setTimeout(()=>reto('mantenlo vivo','tócalo para reavivarlo'),3900);
}
function update4(dt){
  if(!A.me||A.done) return;
  A.age+=dt;
  A.life -= (0.05 + A.age*0.02)*dt;      // se apaga cada vez más rápido
  A.me.material.opacity = Math.max(0,A.life);
  A.me.scale.setScalar(A.me.userData.base*(0.4+Math.max(0,A.life)*0.8));
  A.me.rotation.y+=dt*0.6;
  if(A.life<=0){
    A.done=true; reto(''); A.me.visible=false;
    say('Se apagó. Siempre iba a apagarse.',3200);
    setTimeout(()=>say('La muerte no es el enemigo. Es el <b>marco</b>.<br>Sin el borde, el dibujo no existe.'),3400);
    setTimeout(()=>next(),8200);
  }
}
function click4(){
  if(!A.me||A.done) return;
  ray.setFromCamera(ptr,camera);
  if(ray.intersectObject(A.me,true).length){ A.life=Math.min(1,A.life+0.11);
    A.me.scale.setScalar(A.me.userData.base*1.1); Audio.beat(); }
}

// ===== ACT 5 — la revuelta =====
function enter5(){
  clearGroup(); setAct(5,'la revuelta'); bg('#eef1fb');
  say('El mosco murió sin sentido. Como todos.',3200);
  A.made=[]; A.lines=null;
  setTimeout(()=>{ say('Y justo por eso — el sentido no se encuentra. <b>Se fabrica.</b>',3600);
    reto('construye algo','toca para crear · deja tu marca'); },3400);
}
function click5(){
  if(A.made.length>=9) return;
  const w=screenToWorld();
  const b=makeBlob(COLORS[A.made.length%COLORS.length], 0.5+Math.random()*0.5, A.made.length);
  b.position.set(w.x,w.y,(Math.random()-.5)*2);
  b.userData.spin=(Math.random()-.5)*0.02;
  group.add(b); A.made.push(b); Audio.create(A.made.length-1);
  if(A.made.length>=7 && !A.finished){ finishStory(); }
}
function update5(dt){
  if(!A.made) return;
  const t=performance.now()/1000;
  A.made.forEach((b,i)=>{ b.position.y+=Math.sin(t*0.9+i)*0.003; b.rotation.y+=b.userData.spin||0.005; });
}
let storyDone=false;
function finishStory(){
  A.finished=true; reto(''); Audio.choose();
  // constelación: une los blobs con líneas
  const pts=[]; for(let i=0;i<A.made.length;i++){ pts.push(A.made[i].position, A.made[(i+1)%A.made.length].position); }
  const lg=new THREE.BufferGeometry().setFromPoints(pts);
  A.lines=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:'#272727',transparent:true,opacity:0.35}));
  group.add(A.lines);
  say('No importa que nadie lo vea. Lo hiciste <b>tú</b>.<br>Eso ya es rebelión.');
  setTimeout(()=>{ $cap.style.opacity=0; setAct(null); ACT=6; storyDone=true;
    $outro.style.opacity=1; }, 5200);
}

// ---------- act dispatch ----------
const enters=[enter0,enter1,enter2,enter3,enter4,enter5];
const updates=[update0,null,update2,update3,update4,update5];
const clicks =[click0,click1,null,click3,click4,click5];

async function goAct(n){
  Audio.riser();
  await fade(()=>{ clearGroup(); ACT=n; enters[n](); });
}
function next(){ if(ACT<5) goAct(ACT+1); }

// intro / global input
addEventListener('pointerdown', ()=>{
  if(ACT===-1){ Audio.start(); $intro.style.opacity=0; goAct(0); return; }
  if(ACT>=0 && ACT<=5 && clicks[ACT]) clicks[ACT]();
});
addEventListener('keydown', e=>{ if((e.key==='r'||e.key==='R') && ACT===6){ location.reload(); } });

// hover cursor feedback (blobs)
function hoverCheck(){
  if(ACT<0||ACT>5) return false;
  ray.setFromCamera(ptr,camera);
  return ray.intersectObjects(group.children,true).length>0;
}

// ---------- resize ----------
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

// ---------- música chiptune (Web Audio, sin archivos) ----------
// La menor, melancólica. i–VI–III–VII (Am–F–C–G): triste pero luminosa.
const N = { A2:110, C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196,
            A3:220, C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392, A4:440, C5:523.25, E5:659.25 };
const _=null;
// 32 pasos (4 compases). Melodía tipo pluck, con silencios que dejan respirar.
const LEAD = [N.A4,_,N.E4,_, N.A4,_,N.C5,_,   N.F4,_,N.A4,_, N.C5,_,_,_,
              N.E5,_,N.C5,_, N.G4,_,N.E4,_,   N.D4,_,N.E4,_, N.G4,_,_,_];
const BASS = [N.A2,N.C3, N.A2,N.C3,  N.F3,N.A2, N.F3,N.C3,   // Am / F
              N.C3,N.G3, N.C3,N.E3,  N.G3,N.D3, N.G3,N.A2];  // C  / G  (uno por 2 pasos)

const DRONE_ROOTS = [55, 43.65, 65.41, 49]; // A1 F1 C2 G1 — sigue los acordes por compás
const Audio = {
  ctx:null, master:null, filt:null, drone:null, droneG:null, noise:null,
  on:true, timer:null, step:0, next:0, spb:0.33, vol:0.17,
  start(){
    if(this.ctx){ this.ctx.resume(); return; }
    const C = window.AudioContext||window.webkitAudioContext; if(!C) return;
    this.ctx = new C();
    // buffer de ruido reutilizable (zap / risers)
    const b=this.ctx.createBuffer(1, this.ctx.sampleRate*2, this.ctx.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    this.noise=b;
    this.filt = this.ctx.createBiquadFilter(); this.filt.type='lowpass'; this.filt.frequency.value=2200;
    this.master = this.ctx.createGain(); this.master.gain.value = 0.0;
    this.filt.connect(this.master); this.master.connect(this.ctx.destination);
    this.master.gain.linearRampToValueAtTime(this.vol, this.ctx.currentTime+2.5); // fade-in lento
    // drone grave sostenido: dos sierras desafinadas = peso melancólico
    this.droneG=this.ctx.createGain(); this.droneG.gain.value=0.0;
    this.droneG.gain.linearRampToValueAtTime(0.07, this.ctx.currentTime+3);
    this.droneG.connect(this.filt);
    this.drone=[0,0].map((_,i)=>{ const o=this.ctx.createOscillator();
      o.type='sawtooth'; o.frequency.value=55; o.detune.value=i?9:-9; o.connect(this.droneG); o.start(); return o; });
    this.next = this.ctx.currentTime + 0.1;
    this.timer = setInterval(()=>this._sched(), 25);
  },
  toggle(){
    this.on=!this.on;
    document.getElementById('snd').classList.toggle('off', !this.on);
    if(this.master) this.master.gain.linearRampToValueAtTime(this.on?this.vol:0, this.ctx.currentTime+0.3);
  },
  _mood(){
    const cut = {'-1':2200,0:2000,1:1900,2:1500,3:1150,4:700,5:2800}[ACT] ?? 1800;
    if(this.filt) this.filt.frequency.setTargetAtTime(cut, this.ctx.currentTime, 0.4);
    this.sparse = (ACT===4);        // en la muerte la melodía se adelgaza
  },
  _sched(){
    if(!this.ctx) return;
    while(this.next < this.ctx.currentTime + 0.12){
      this._mood();
      const s = this.step % 32, bar = (s/8)|0;
      if(s%8===0 && this.drone){ const r=DRONE_ROOTS[bar];
        this.drone.forEach(o=>o.frequency.setTargetAtTime(r, this.next, 0.2)); }
      const lead = LEAD[s];
      if(lead && !(this.sparse && (s%4!==0))) this._voice(lead, this.next, this.spb*1.7, 'square', 0.13, true);
      if(s % 2 === 0){ const b = BASS[(s/2)%16]; if(b) this._voice(b, this.next, this.spb*1.9, 'triangle', 0.22); }
      this.next += this.spb; this.step++;
    }
  },
  _voice(freq, t, dur, type, vol, fat){
    const spawn=(f,v)=>{ const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
      o.connect(g); g.connect(this.filt); o.start(t); o.stop(t+dur+0.02); };
    spawn(freq, vol);
    if(fat) spawn(freq*1.006, vol*0.5);   // segunda voz desafinada = timbre agridulce
  },
  // riser de tensión en cada transición de acto
  riser(dur=0.6){
    if(!this.ctx) return; const t=this.ctx.currentTime;
    const src=this.ctx.createBufferSource(); src.buffer=this.noise; src.loop=true;
    const bp=this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
    bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(3500,t+dur);
    const g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.09,t+dur*0.8); g.gain.linearRampToValueAtTime(0,t+dur+0.1);
    src.connect(bp); bp.connect(g); g.connect(this.master); src.start(t); src.stop(t+dur+0.15);
  },
  // ZAP: el mosco atropellado. ruido + barrido descendente + golpe grave, y la música se agacha.
  zap(){
    if(!this.ctx) return; const t=this.ctx.currentTime;
    if(this.master){ this.master.gain.cancelScheduledValues(t);
      this.master.gain.setValueAtTime(this.on?this.vol:0,t);
      this.master.gain.linearRampToValueAtTime(0.03,t+0.02);
      this.master.gain.linearRampToValueAtTime(this.on?this.vol:0,t+0.6); }
    // barrido cuadrado agudo→grave
    const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.type='square';
    o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(55,t+0.18);
    g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+0.22);
    // reventón de ruido
    const nz=this.ctx.createBufferSource(); nz.buffer=this.noise;
    const hp=this.ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1200;
    const ng=this.ctx.createGain(); ng.gain.setValueAtTime(0.3,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.13);
    nz.connect(hp); hp.connect(ng); ng.connect(this.ctx.destination); nz.start(t); nz.stop(t+0.15);
    // golpe grave (thud)
    const s=this.ctx.createOscillator(), sg=this.ctx.createGain(); s.type='sine';
    s.frequency.setValueAtTime(120,t); s.frequency.exponentialRampToValueAtTime(38,t+0.25);
    sg.gain.setValueAtTime(0.5,t); sg.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    s.connect(sg); sg.connect(this.ctx.destination); s.start(t); s.stop(t+0.32);
  },
  // --- SFX de selección (varias variantes aleatorias para que no se repitan) ---
  _seq(freqs, {type='square', vol=0.2, step=0.06}={}){
    if(!this.ctx) return; const t0=this.ctx.currentTime, dest=this.filt||this.ctx.destination;
    freqs.forEach((f,i)=>{ const t=t0+i*step, o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.001,t+step*1.6);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t+step*1.8); });
  },
  _rand(a){ return a[(Math.random()*a.length)|0]; },
  pick(){   // toque genérico (enjambre): blip corto ascendente
    this._seq(this._rand([[N.E4,N.A4],[N.C4,N.G4],[N.D4,N.A4],[N.E4,N.G4,N.C5],[N.A4,N.C5,N.E5],[N.C4,N.E4,N.G4]]),
      {type:'square', vol:0.17, step:0.05}); },
  choose(){ // elección de puerta: acorde decidido, más lleno
    this._seq(this._rand([[N.A3,N.E4,N.A4],[N.C4,N.G4,N.C5],[N.D4,N.A4,N.F4],[N.E4,N.A4,N.C5]]),
      {type:'square', vol:0.2, step:0.075}); },
  create(i){ // crear blob: nota de escala pentatónica → construir = melodía
    const SC=[N.A3,N.C4,N.D4,N.E4,N.G4,N.A4,N.C5,N.E5];
    this._seq([this._rand([SC[i%SC.length], SC[i%SC.length]*2])], {type:'triangle', vol:0.2, step:0.1}); },
  beat(){   // latido (reavivar): thump grave + blip, con variación de tono
    if(!this.ctx) return; const t=this.ctx.currentTime, f=150+Math.random()*40;
    const s=this.ctx.createOscillator(), g=this.ctx.createGain(); s.type='sine';
    s.frequency.setValueAtTime(f,t); s.frequency.exponentialRampToValueAtTime(f*0.4,t+0.14);
    g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    s.connect(g); g.connect(this.ctx.destination); s.start(t); s.stop(t+0.18);
    this._seq([N.A4*(0.97+Math.random()*0.06)], {type:'square', vol:0.11, step:0.05}); },
  deny(){   // selección "equivocada": blip descendente, apagado
    this._seq(this._rand([[N.A4,N.F4],[N.E4,N.C4],[N.G4,N.D4]]), {type:'triangle', vol:0.15, step:0.085}); }
};
addEventListener('keydown', e=>{ if(e.key==='m'||e.key==='M') Audio.toggle(); });

// ---------- loop ----------
const clock=new THREE.Clock();
function tick(){
  const dt=Math.min(clock.getDelta(),0.033);
  camera.position.x += (ptr.x*1.6 - camera.position.x)*0.03;
  camera.position.y += (ptr.y*1.0 - camera.position.y)*0.03;
  camera.lookAt(0,0,0);
  if(ACT>=0&&ACT<=5&&updates[ACT]) updates[ACT](dt);
  document.body.classList.toggle('grab', hoverCheck());
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();

// cursor follow
const cursorEl=document.getElementById('cursor');
(function cur(){ cursorEl.style.left=ptrPx.x+'px'; cursorEl.style.top=ptrPx.y+'px'; requestAnimationFrame(cur); })();

// todo cargó bien → ya podemos ocultar el cursor nativo y mostrar la manita
document.body.classList.add('ready');

// drag para acto 2 (Sísifo)
addEventListener('pointerdown',()=>{ if(ACT===2&&A.rock){ ray.setFromCamera(ptr,camera);
  if(ray.intersectObject(A.rock,true).length) A.grab=true; } });
addEventListener('pointerup',()=>{ if(ACT===2) A.grab=false; });
</script>
</body>
